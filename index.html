<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <title>MARC RÉPARE — Votre problème, notre solution</title>
    <meta
      name="description"
      content="MARC RÉPARE : maintenance informatique, réseaux, Starlink, Wi-Fi, vidéosurveillance et dépannage technique à Abidjan."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#f5f7fb",
              surface: "#ffffff",
              "surface-alt": "#eef2f9",
              ink: "#0b1633",
              "ink-2": "#0c1150",
              "ink-muted": "#5b6478",
              "ink-faint": "#94a0b8",
              accent: "#0b7d92",
              "accent-2": "#1cabc4",
              "accent-soft": "#e4f3f6",
              ok: "#16a34a",
              line: "#e4e8f1",
            },
            fontFamily: {
              display: ['"Space Grotesk"', "system-ui", "sans-serif"],
              body: ["Inter", "system-ui", "sans-serif"],
              mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
            },
            keyframes: {
              "pulse-dot": {
                "0%": { boxShadow: "0 0 0 0 rgba(22,163,74,0.45)" },
                "70%": { boxShadow: "0 0 0 8px rgba(22,163,74,0)" },
                "100%": { boxShadow: "0 0 0 0 rgba(22,163,74,0)" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0px)" },
                "50%": { transform: "translateY(-10px)" },
              },
            },
            animation: {
              "pulse-dot": "pulse-dot 2.2s infinite",
              float: "float 5s ease-in-out infinite",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-bg text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
